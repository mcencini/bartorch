name: Typos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `toml` extra is what lets codespell read `[tool.codespell]`
      # from pyproject.toml on a Python that has no `tomllib`.
      - name: Install codespell
        run: pip install "codespell[toml]"

      - name: Run codespell
        # What to skip, and what is a word here rather than a typo, is in
        # `[tool.codespell]` in pyproject.toml -- the same place
        # `scripts/lint.sh` reads it, so a local run and this one cannot
        # disagree.  That they could is why this check failed on a branch
        # whose author had run the lint script and seen it pass.
        run: codespell
