name: Typos

on:
  push:
    branches: [main, develop, bart-pytorch-extension]
  pull_request:
    branches: [main, develop, bart-pytorch-extension]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell
        # The skips need the `./` codespell prints, or they match nothing:
        # `external/` did not exclude `./external/bart`, which is why this
        # check had never passed.  `nd` and `optin` are identifiers rather
        # than typos -- BART writes `int ND` for a doubled dimension count,
        # and CUDA spells its own attribute
        # `cudaDevAttrMaxSharedMemoryPerBlockOptin`.  `build` and
        # `docs/_build` are outputs a fresh checkout does not have and a
        # local run does.
        run: codespell --skip="./attic,./external,./.git,./build,./docs/_build,*.ipynb,pyproject.toml" --ignore-words-list=ist,te,reconet,pyramide,nd,optin
