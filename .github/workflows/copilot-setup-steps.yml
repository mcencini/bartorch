name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler and CMake
        run: sudo apt-get install -y cmake clang

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core setuptools-scm numpy pytest scipy ruff
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # As in the test matrix: torchvision comes with deepinv, and its
      # compiled operators are built against one particular torch.  From PyPI
      # it takes the default build while torch here is the CPU one, and the
      # mismatch is `operator torchvision::nms does not exist` the moment
      # deepinv is imported.  Same index, same pair.
      - name: Install torchvision from the same index as torch
        run: pip install torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Build and install bartorch
        env:
          CC: clang
          CXX: clang++
        run: pip install -e . --no-build-isolation
