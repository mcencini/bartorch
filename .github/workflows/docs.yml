name: Docs

# Builds the reference on every pull request, and publishes it to GitHub Pages
# from `main`.  Both use the same `./scripts/build_docs.sh` a contributor runs,
# so a page that renders here rendered for them too.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".  Nothing else;
# the deploy job below carries its own permissions and environment.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "*.md"
      - "*.rst"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # Job 1: validate that the docs build (runs on every PR and push)
  # Nothing is compiled: docs/conf.py extracts the reference from the checkout
  # rather than from an installed package.  This is what ./scripts/build_docs.sh
  # runs locally.
  # -------------------------------------------------------------------------
  build-docs:
    name: Build Sphinx docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # For `docs/misc/license.rst`, which includes BART's own.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the documentation requirements
        run: pip install -r docs/requirements.txt

      - name: Build Sphinx HTML
        run: ./scripts/build_docs.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sphinx-html
          path: docs/_build/html/
          retention-days: 7

      # The same HTML again, in the layout Pages deploys from.  Uploaded on
      # pull requests too, so that a change which breaks the packaging step
      # says so on the pull request rather than on main.
      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html/

  # Only from `main`, and only on a push: a pull request builds the site and
  # says whether it would deploy, but does not publish it.
  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
