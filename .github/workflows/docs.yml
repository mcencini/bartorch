name: Docs (ReadTheDocs)

# This workflow triggers a ReadTheDocs build whenever documentation-relevant
# files are updated on the main branch.
#
# Setup instructions:
# 1. Create an account at https://readthedocs.org and import this repository.
# 2. In your RTD project settings, go to Integrations and copy the webhook URL.
# 3. Add it as a repository secret: Settings → Secrets → READTHEDOCS_WEBHOOK_TOKEN
#    (RTD uses a token in the URL, not a separate header secret).
# 4. Uncomment the "Trigger ReadTheDocs build" step below.
#
# The workflow also validates that the docs build without errors using a local
# Sphinx build on every pull request.

on:
  push:
    branches: [main, bart-pytorch-extension]
    paths:
      - "docs/**"
      - "src/**"
      - "*.md"
      - "*.rst"
  pull_request:
    branches: [main, develop, bart-pytorch-extension]
    paths:
      - "docs/**"
      - "src/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # Job 1: validate that the docs build (runs on every PR and push)
  # Nothing is compiled: docs/conf.py extracts the reference from the checkout
  # rather than from an installed package, and the gallery is rendered without
  # being executed unless BARTORCH_DOCS_EXECUTE says otherwise.  This is what
  # ./scripts/build_docs.sh runs locally.
  # -------------------------------------------------------------------------
  build-docs:
    name: Build Sphinx docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # For `docs/misc/license.rst`, which includes BART's own.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the documentation requirements
        run: pip install -r docs/requirements.txt

      - name: Build Sphinx HTML
        run: ./scripts/build_docs.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sphinx-html
          path: docs/_build/html/
          retention-days: 7
