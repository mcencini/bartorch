name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # libbartorch is a clang build: BART's nested functions become Blocks.
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            cc: clang
          - os: ubuntu-latest
            python-version: "3.12"
            cc: clang
            # One job measures coverage for Codecov; the rest only test.
            coverage: true
          - os: ubuntu-latest
            python-version: "3.12"
            cc: gcc-14
            extras: "[mkl]"
          - os: macos-latest
            python-version: "3.12"
            cc: clang
    runs-on: ${{ matrix.os }}
    # Codecov takes the upload on GitHub's OIDC token, so no secret is needed.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install compiler, OpenMP and CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake ${{ matrix.cc }} libomp-dev

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core setuptools-scm numpy scipy pytest pytest-cov numpydoc
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # deepinv pulls in torchvision, whose compiled operators are built
      # against one particular torch.  Left to PyPI it takes the default
      # build while torch here is the CPU one, and the mismatch shows up as
      # `operator torchvision::nms does not exist` the moment deepinv is
      # imported.  Taking it from the same index makes the pair agree.
      #
      # Every job needs this now: deepinv is a dependency rather than an
      # extra, so every install pulls torchvision whatever the matrix says.
      # Linux only because that index publishes no macOS wheel -- there both
      # come from PyPI, which is consistent with itself.
      - name: Install torchvision from the same index as torch
        if: runner.os == 'Linux'
        run: pip install torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Build and install bartorch
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'gcc-14' && 'g++-14' || 'clang++' }}
        run: pip install -e ".${{ matrix.extras }}" --no-build-isolation -v

      # Both wheels carry their own copy of LLVM's OpenMP runtime, and the
      # runtime ends the process rather than run beside a second copy.  The
      # repair is bartorch's own, on the first NUFFT, so this reaches it the
      # way an install does rather than patching ahead of it: the pair is
      # read here while it is still two runtimes, the step below brings the
      # library up and that is what repairs it, and `verify` after says the
      # loader agrees and neither runtime aborts.
      - name: The pair, before bartorch has repaired it (macOS)
        if: runner.os == 'macOS'
        run: python scripts/macos_openmp.py diagnose

      # Before the suite, because the suite is where the information goes
      # missing: bringing the library up is what installs the FINUFFT
      # substitution -- repairing the OpenMP pair on macOS, then probing
      # itself by running `bart nufft` both ways -- and pytest has stdout and
      # stderr captured for collection, so a process that dies there dies
      # with the reason unprinted.  Run it once with the log going straight
      # to the console, so a failure says what it was.
      - name: Report what the library came up with
        run: |
          python - <<'EOF'
          import logging, traceback
          logging.basicConfig(level=logging.DEBUG, format="%(name)s: %(message)s")
          import bartorch
          print("build:", bartorch.build_info())
          print("backends:", bartorch.backend_sources())
          try:
              from bartorch import _finufft
              print("finufft available:", _finufft.available())
              print("finufft in tools:", _finufft.used_in_tools())
          except Exception:
              # A diagnostic must not be able to fail the thing it is
              # diagnosing.  An abort still ends the job, which is the point;
              # a name that moved should not.
              traceback.print_exc()
          EOF

      # After the step above, which is what brought the library up: on macOS
      # that is where `_macos_openmp.ensure()` ran, and this says it took.
      - name: One OpenMP runtime, repaired by bartorch itself (macOS)
        if: runner.os == 'macOS'
        run: python scripts/macos_openmp.py verify

      - name: Run the test suite
        run: pytest tests/ -v ${{ matrix.coverage && '--cov --cov-report=xml' || '' }}

      # A rejected upload is a broken report, not a passing build: without
      # this the step is green whatever Codecov answers, and the badge goes
      # stale with nothing to say so.
      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: coverage.xml

  # The runners have no GPU, so the CUDA build is checked as far as a machine
  # without a card allows: it compiles, links, loads, and runs the host suite.
  cuda-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the CUDA toolkit, clang and OpenMP
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake clang libomp-dev nvidia-cuda-toolkit

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core setuptools-scm numpy scipy pytest numpydoc
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # As in the test matrix: torchvision comes with deepinv, and its
      # compiled operators are built against one particular torch.  From PyPI
      # it takes the default build while torch here is the CPU one, and the
      # mismatch is `operator torchvision::nms does not exist` the moment
      # deepinv is imported.  Same index, same pair.
      - name: Install torchvision from the same index as torch
        run: pip install torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Build with BART's CUDA kernels
        env:
          CC: clang
          CXX: clang++
        run: pip install -e . --no-build-isolation --config-settings=cmake.define.BARTORCH_CUDA=ON

      - name: The CUDA build must report its device code and run on the host
        run: |
          python -c "import bartorch; assert 'cuda=ON' in bartorch.build_info()"
          pytest tests/ -v
