name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # libbartorch is a clang build: BART's nested functions become Blocks.
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            cc: clang
          - os: ubuntu-latest
            python-version: "3.12"
            cc: clang
          - os: ubuntu-latest
            python-version: "3.12"
            cc: gcc-14
            extras: "[mkl,finufft,deepinv]"
          - os: macos-latest
            python-version: "3.12"
            cc: clang
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install compiler, OpenMP and CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake ${{ matrix.cc }} libomp-dev

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core numpy scipy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build and install bartorch
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'gcc-14' && 'g++-14' || 'clang++' }}
        run: pip install -e ".${{ matrix.extras }}" --no-build-isolation -v

      - name: Run the test suite
        run: pytest tests/ -v

  # The runners have no GPU, so the CUDA build is checked as far as a machine
  # without a card allows: it compiles, links, loads, and runs the host suite.
  cuda-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the CUDA toolkit, clang and OpenMP
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake clang libomp-dev nvidia-cuda-toolkit

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core numpy scipy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build with BART's CUDA kernels
        env:
          CC: clang
          CXX: clang++
        run: pip install -e . --no-build-isolation --config-settings=cmake.define.BARTORCH_CUDA=ON

      - name: The CUDA build must report its device code and run on the host
        run: |
          python -c "import bartorch; assert 'cuda=ON' in bartorch.build_info(); assert bartorch.cuda.built()"
          pytest tests/ -v
