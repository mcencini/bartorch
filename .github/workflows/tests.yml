name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # libbartorch is a clang build: BART's nested functions become Blocks.
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            cc: clang
          - os: ubuntu-latest
            python-version: "3.12"
            cc: clang
          - os: macos-latest
            python-version: "3.12"
            cc: clang
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install compiler and CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake ${{ matrix.cc }}

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core numpy pytest scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build and install bartorch
        env:
          CC: ${{ matrix.cc }}
          CXX: clang++
        run: pip install -e . --no-build-isolation -v

      - name: Run the test suite
        run: pytest tests/ -v
