name: Publish to PyPI

# Wheels carry a Python-independent C library, so one wheel per platform
# serves every interpreter and every torch version.  They are built with
# cibuildwheel from a pure-Python "py3" target and published through PyPI's
# trusted publisher on a version tag.
#
# One-time setup on PyPI: add a trusted publisher for owner mcencini,
# repository bartorch, workflow publish.yml, environment pypi, and create the
# "pypi" environment in this repository's settings.

on:
  push:
    tags:
      - "v*"
  # A tag is the one thing that cannot be taken back: the version it builds
  # can never be reused on PyPI, and nothing else in the repository runs this
  # file, so every defect in it waits until a release to appear.  Running it
  # by hand builds, repairs and tests every wheel exactly as a tag would;
  # what it does not do is publish, because the two jobs that hand anything
  # over ask for a tag ref and a branch is not one.
  workflow_dispatch:

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No Linux aarch64 wheel.  FINUFFT computes every non-Cartesian
        # transform here and ships no wheel for that platform, so a wheel
        # built for it would install a bartorch that cannot do non-Cartesian
        # work -- and requiring the source build instead would ask for CMake,
        # ninja and a C++ compiler from someone installing a wheel.  aarch64
        # is served by the sdist, where that toolchain is already the price of
        # entry.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v2.23
        env:
          # One build per platform: the wheel is tagged py3 and carries no
          # interpreter, so building it once per Python would only produce the
          # same file under the same name.  What the interpreters get is the
          # test matrix below.
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_*"
          # cibuildwheel's Linux default is auto64 *and* auto32, so an x86_64
          # runner also builds a 32-bit i686 wheel -- in the i686 image, which
          # is still manylinux2014 and its GCC 10.  Nobody could install that
          # wheel in any case: torch publishes no i686 build, and it is a hard
          # dependency here.
          CIBW_ARCHS_LINUX: x86_64
          # BART's nested functions need heap trampolines -- GCC 14 -- or
          # clang's Blocks.  cibuildwheel's default Linux image has neither:
          # manylinux2014 is CentOS 7, whose GCC is 10 and whose `clang` is
          # 3.4.2, so old that it cannot link a hello world against the
          # devtoolset runtime it is installed beside.  manylinux_2_28 is the
          # image the CUDA wheel below already builds in, and its default cc
          # is GCC 14.2.1: nothing to install, and no compiler to override.
          # The floor it sets, glibc 2.28, is the one torch and FINUFFT
          # already ship their own Linux wheels against.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # FINUFFT is a dependency, so installing the wheel brings it and the
          # non-Cartesian tests run.
          CIBW_TEST_REQUIRES: pytest numpy scipy
          CIBW_TEST_COMMAND: pip install torch --index-url https://download.pytorch.org/whl/cpu && pytest {project}/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # The wheel carries no interpreter, so what has to be checked across Python
  # versions is that the package drives it: ctypes signatures, the torch and
  # numpy APIs it uses, and the tools' generated wrappers.
  test-wheels:
    name: Test ${{ matrix.os }} on Python ${{ matrix.python }}
    needs: [wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          pip install pytest numpy scipy wheelhouse/*.whl
          pytest tests -q

  # A CUDA wheel carries BART's device code and links the runtime libraries
  # dynamically, so it stays a few megabytes rather than bundling cuFFT and
  # cuBLAS.  It has the same name, version and platform tag as the CPU wheel,
  # which PyPI cannot hold twice, so it goes to the release instead:
  #
  #     pip install https://github.com/mcencini/bartorch/releases/download/<tag>/<wheel>
  #
  # The runners have no card, so this proves the wheel loads and reports the
  # absence of one; scripts/check_device.py is what a machine with a card runs.
  wheels-cuda:
    name: Build CUDA wheel (linux x86_64)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0
      - name: Install the CUDA toolkit
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo \
            https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf install -y --nogpgcheck cuda-nvcc-12-8 cuda-cudart-devel-12-8 \
            libcufft-devel-12-8 libcublas-devel-12-8
          echo /usr/local/cuda-12.8/bin >> $GITHUB_PATH
          echo /opt/python/cp312-cp312/bin >> $GITHUB_PATH
      # BART needs GCC 14 for -ftrampoline-impl=heap, or clang 16+ for Blocks;
      # the manylinux image's default toolchain is checked at configure time
      # and the build fails loudly if it is older.
      # The pair kernels are cuFFTDx, whose headers come with MathDx: only the
      # build reads them, and the wheel carries what they compile to, so a
      # machine running it needs the driver and nothing else.  The sizes they
      # are compiled for are BARTORCH_PAIRED_SIZES's default (CMakeLists.txt).
      - name: Fetch MathDx
        run: |
          python -m pip install nvidia-mathdx==25.6.0
          echo "MATHDX_DIR=$(python -c 'import os, sysconfig; print(os.path.join(sysconfig.get_paths()["purelib"], "nvidia", "mathdx"))')" >> $GITHUB_ENV
      - name: Build the wheel
        env:
          CUDACXX: /usr/local/cuda-12.8/bin/nvcc
        run: |
          cc --version
          python -m pip install build
          python -m build --wheel --outdir dist/ \
            -C cmake.define.BARTORCH_CUDA=ON \
            -C "cmake.define.BARTORCH_MATHDX_DIR=$MATHDX_DIR"
      # The CUDA runtimes are excluded rather than vendored: torch already
      # brings them, and bundling them would add hundreds of megabytes.
      - name: Repair to a manylinux tag
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install auditwheel
          LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64 \
          /opt/python/cp312-cp312/bin/python -m auditwheel repair dist/*.whl \
            -w wheelhouse/ --plat manylinux_2_28_x86_64 \
            --exclude libcudart.so.12 --exclude libcufft.so.11 \
            --exclude libcublas.so.12 --exclude libcublasLt.so.12
      - name: Check that it loads without a card
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install wheelhouse/*.whl \
            torch --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          /opt/python/cp312-cp312/bin/python -c "
          import bartorch
          from bartorch import _cuda
          info = bartorch.build_info()
          print(info)
          assert 'cuda=ON' in info, info
          print('devices:', _cuda.device_count())
          "
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-wheel
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, wheels, test-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/bartorch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The CUDA wheel cannot go to PyPI beside the CPU one, so it is attached to
  # the release the tag made.
  release-cuda:
    name: Attach the CUDA wheel to the release
    runs-on: ubuntu-latest
    needs: [wheels-cuda]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cuda-wheel
          path: wheelhouse
      - uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
