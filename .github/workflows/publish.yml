name: Publish to PyPI

# Wheels carry a Python-independent C library, so one wheel per platform
# serves every interpreter and every torch version.  They are built with
# cibuildwheel from a pure-Python "py3" target and published through PyPI's
# trusted publisher on a version tag.
#
# One-time setup on PyPI: add a trusted publisher for owner mcencini,
# repository bartpy, workflow publish.yml, environment pypi, and create the
# "pypi" environment in this repository's settings.

on:
  push:
    tags:
      - "v*"

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v2.23
        env:
          # The library is built once per platform; the interpreter is irrelevant.
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_*"
          # BART's nested functions compile to Blocks under clang, which is
          # the only route on aarch64; manylinux images ship clang via dnf.
          CIBW_BEFORE_ALL_LINUX: dnf install -y clang || yum install -y clang
          CIBW_ENVIRONMENT_LINUX: CC=clang CXX=clang++
          CIBW_TEST_REQUIRES: pytest numpy scipy
          CIBW_TEST_COMMAND: pip install torch --index-url https://download.pytorch.org/whl/cpu && pytest {project}/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/bartorch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
