name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `scripts/lint.sh` runs codespell as well as ruff, so that what a
      # contributor runs is what CI runs.
      - name: Install ruff and codespell
        run: pip install ruff "codespell[toml]"

      - name: Lint
        run: ./scripts/lint.sh
