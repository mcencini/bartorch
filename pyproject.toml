[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "bartorch"
# From the git tag, so a release cannot disagree with the tag that made it.
dynamic = ["version"]
description = "BART, the Berkeley Advanced Reconstruction Toolbox, embedded in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # BLAS and LAPACK come from compiled libraries already in the process:
    # what torch links, and SciPy's cython_blas / cython_lapack tables.
    "scipy>=1.10",
    # Off-resonance correction fits its coefficients by a least-squares
    # problem over a histogram of the field map -- not something BART has a
    # primitive for, and not something to write a second time.  mri-nufft has
    # three factorizations of it (svd, mti, mfi) and bartorch.linop's
    # FieldCorrected calls them.
    #
    # It is a dependency rather than an extra, which costs every install:
    # mri-nufft asks for numpy>=2.2 and scipy>=1.13, above the floors here, and
    # for matplotlib, which its very first module imports.  That was weighed
    # and accepted -- off-resonance is the common case here, not a corner.
    "mri-nufft>=1.0",
    # 2.2 is deepinv's floor; stated here rather than left to the resolver.
    "torch>=2.2",
    # TorchSim is the signal model.  `nlop.FromTorchSim` turns any of its
    # simulators into a BART nonlinear operator -- value, Jacobian-vector
    # product and adjoint product, which is exactly what `nlop_s` asks for --
    # and `nlop.InversionRecovery`, `nlop.MultiEcho` and `nlop.Bloch` are
    # `moba`'s families written on it.  Every quantitative reconstruction here
    # goes through it, so it is not an extra.
    #
    # It asks for numpy, scipy and torch, all of which are here already, and
    # nothing else.
    "torchsim>=0.0.5",
    # FINUFFT is the NUFFT.  Every non-Cartesian transform BART makes goes
    # through the substitution under `nufft_create`, and nothing reaches BART's
    # own gridder without having been sent there, so a bartorch without FINUFFT
    # is one that cannot do non-Cartesian work at all.  That is a dependency,
    # and there is no extra to ask for it with.
    #
    # It carries no marker because it needs none: a wheel is built only for the
    # platforms FINUFFT ships a wheel for too, so installing one never starts a
    # build.  Anywhere else -- Linux on aarch64, an Intel Mac -- the install is
    # from the sdist, and compiling BART is already the price of entry there.
    "finufft>=2.2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/mcencini/bartorch"
Documentation = "https://mcencini.github.io/bartorch/"
Repository = "https://github.com/mcencini/bartorch"
Issues = "https://github.com/mcencini/bartorch/issues"

[project.optional-dependencies]
# deepinv is a source of denoisers, losses and samplers, reached through
# `priors.ImplicitPrior` and `bartorch.interop.to_deepinv`; nothing else here
# imports it.
deepinv = [
    "deepinv>=0.2",
]
# MKL covers every BLAS and LAPACK routine BART calls and is about twice as
# fast as the alternatives on the work that leans on LAPACK.  There is no MKL
# wheel for macOS, where SciPy's OpenBLAS and Accelerate serve instead, and
# Windows is not a target: BART does not build there.
mkl = [
    "mkl>=2024; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# There is no `finufft` extra: it is a dependency, above.  An old
# `pip install 'bartorch[finufft]'` still installs FINUFFT, and pip warns that
# the extra is not provided -- which is the right thing to hear.
# cuFINUFFT stays optional: it serves a transform on a card, and there is no
# card on most machines.  It is taken through the C API its wheel exports: a
# sample count of int64 in `cufinufftf_setpts` and defaults filled from the
# options struct alone.  That is the API from 2.3 on.
cufinufft = ["cufinufft>=2.3"]
dev = [
    "pytest>=7",
    "ruff",
]
# Kept the same as docs/requirements.txt.  Rendering imports the package from
# the checkout, which needs torch but not the compiled library.
docs = [
    "sphinx>=7.3,<9",
    "sphinx-book-theme>=1.1,<2",
    "sphinx-copybutton>=0.5,<1",
    "myst-parser>=3,<5",
]

# The compiled library is pure C reached through ctypes, so one wheel per
# platform serves every interpreter and every torch version.
[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/bartorch"]
wheel.py-api = "py3"
sdist.exclude = ["attic/", "build/"]

# The section has to exist for setuptools-scm to be used at all, even empty.
# A checkout with no tags -- a fork, a shallow clone, an sdist unpacked outside
# git -- gets the fallback rather than an error, because a missing tag should
# not be a build failure.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
# Written by scripts/gen_abi.py and scripts/gen_catalogue.py, and held against
# those generators by tests/test_abi.py and tests/test_catalogue.py.  A
# formatter that rewrote them would fail that test rather than fix anything;
# how they are laid out is the generator's business.
exclude = ["src/bartorch/_abi.py", "src/bartorch/_catalogue.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
# A gallery example is written in cells, and an import belongs to the cell that
# introduces what it imports rather than to the top of the file.
"docs/examples/*" = ["E402"]
# A help string BART wrote can be longer than any line length on its own.
"src/bartorch/_catalogue.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.codespell]
# One place for what the spelling check reads, so that `scripts/lint.sh` and
# the workflow cannot drift apart.  The skips need the `./` codespell prints,
# or they match nothing: `external/` did not exclude `./external/bart`, which
# is why this check had never passed.  `nd` and `optin` are identifiers rather
# than typos -- BART writes `int ND` for a doubled dimension count, and CUDA
# spells its own attribute `cudaDevAttrMaxSharedMemoryPerBlockOptin`.  `build`
# and `docs/_build` are outputs a fresh checkout does not have and a local run
# does.  `reson` is the journal abbreviation in a citation, as in
# `Magn Reson Med`.
skip = "./attic,./external,./.git,./build,./docs/_build,./docs/auto_examples,*.ipynb,pyproject.toml"
ignore-words-list = "ist,te,reconet,pyramide,nd,optin,lamda,reson"
