[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "bartorch"
version = "0.2.0.dev0"
description = "BART, the Berkeley Advanced Reconstruction Toolbox, embedded in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # BLAS and LAPACK come from compiled libraries already in the process:
    # what torch links, and SciPy's cython_blas / cython_lapack tables.
    "scipy>=1.10",
    "torch>=2.1",
    # FINUFFT is the NUFFT.  Every non-Cartesian transform BART makes goes
    # through the substitution under `nufft_create`, and nothing reaches BART's
    # own gridder without having been sent there, so a bartorch without FINUFFT
    # is one that cannot do non-Cartesian work at all.  That is a dependency,
    # and there is no extra to ask for it with.
    #
    # It carries no marker because it needs none: a wheel is built only for the
    # platforms FINUFFT ships a wheel for too, so installing one never starts a
    # build.  Anywhere else -- Linux on aarch64, an Intel Mac -- the install is
    # from the sdist, and compiling BART is already the price of entry there.
    "finufft>=2.2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
# MKL covers every BLAS and LAPACK routine BART calls and is about twice as
# fast as the alternatives on the work that leans on LAPACK.  There is no MKL
# wheel for macOS, where SciPy's OpenBLAS and Accelerate serve instead.
mkl = [
    "mkl>=2024; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mkl>=2024; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# There is no `finufft` extra: it is a dependency, above.  An old
# `pip install 'bartorch[finufft]'` still installs FINUFFT, and pip warns that
# the extra is not provided -- which is the right thing to hear.
# cuFINUFFT stays optional: it serves a transform on a card, and there is no
# card on most machines.  It is taken through the C API its wheel exports: a
# sample count of int64 in `cufinufftf_setpts` and defaults filled from the
# options struct alone.  That is the API from 2.3 on.
cufinufft = ["cufinufft>=2.3"]
# deepinv is an adapter, not a base class: LinearOperator.to_deepinv() hands an
# operator over as a LinearPhysics, and nothing in the package imports deepinv
# until it is called.
deepinv = ["deepinv>=0.2"]
dev = [
    "pytest>=7",
    "ruff",
    "deepinv>=0.2",
]
# Kept the same as docs/requirements.txt, which builds the reference on its
# own: `docs/conf.py` extracts the API from the checkout rather than from an
# installed package, so rendering needs neither torch nor a compiled library.
docs = [
    "sphinx>=8.1,<9",
    "sphinx-book-theme>=1.1,<2",
    "sphinx-gallery>=0.17,<0.20",
    "sphinx-copybutton>=0.5,<1",
    "matplotlib>=3.7,<4",
]

# The compiled library is pure C reached through ctypes, so one wheel per
# platform serves every interpreter and every torch version.
[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/bartorch"]
wheel.py-api = "py3"
sdist.exclude = ["attic/", "build/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
# A help string BART wrote can be longer than any line length on its own.
"src/bartorch/_catalogue.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
